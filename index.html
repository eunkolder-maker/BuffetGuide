<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161210">
  <title>마키노 조식뷔페</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="hero-header">
    <div class="hero-inner">
      <h1>마키노 조식뷔페</h1>
      <p>배치도에서 코너를 선택하면 세팅 정보와 사진을 확인할 수 있습니다.</p>

      <label class="search-box" for="food-search">
        <span class="search-icon" aria-hidden="true"></span>
        <input
          id="food-search"
          type="search"
          placeholder="음식 검색"
          autocomplete="off"
          aria-label="음식 검색"
        >
      </label>
    </div>
  </header>

  <main class="page-container">
    <section class="map-section" aria-labelledby="map-title">
      <div class="section-heading">
        <div>
          <span class="eyebrow">BUFFET MAP</span>
          <h2 id="map-title">전체 배치도</h2>
        </div>
        <button id="reset-button" class="secondary-button" type="button">
          전체 보기
        </button>
      </div>

      <div class="map-card">
        <div class="map-stage" id="map-stage">
          <img
            id="buffet-map"
            src="map.png"
            alt="마키노 조식뷔페 전체 배치도"
          >

          <!--
            다음 단계에서 이곳에 투명 클릭 버튼을 추가합니다.

            예시:
            <button
              class="hotspot"
              data-corner="bread"
              style="left:20%; top:15%; width:24%; height:10%;"
              aria-label="빵 코너"
            ></button>
          -->
        </div>
      </div>

      <p class="map-guide">배치도를 위아래로 스크롤해 전체 구성을 확인하세요.</p>
    </section>

    <section class="detail-card" id="detail-card" aria-live="polite">
      <div class="empty-state">
        <span class="empty-icon">⌁</span>
        <h2>선택한 코너</h2>
        <p>
          이후 배치도의 음식 코너를 터치하면 사진, 기물,
          세팅 방법과 주의사항이 여기에 표시됩니다.
        </p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    Makino Breakfast Buffet Setting Guide
  </footer>

  <script src="script.js"></script>
</body>
</html>
