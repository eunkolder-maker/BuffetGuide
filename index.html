<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마키노 조식 뷔페 가이드</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Pretendard, Arial, sans-serif;
}

body{
    background:#f5f5f5;
    color:#333;
}

header{
    position:sticky;
    top:0;
    background:white;
    padding:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    z-index:999;
}

header h1{
    font-size:24px;
}

header p{
    margin-top:5px;
    color:#777;
}

.search{
    margin-top:15px;
}

.search input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#f2f2f2;
    font-size:16px;
}

.container{

    max-width:700px;
    margin:auto;
    padding:20px;

}

.card{

    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,.08);

}

.card img{

    width:100%;
    display:block;

}

.notice{

    padding:18px;
    text-align:center;
    color:#666;
    font-size:16px;

}

.info{

    margin-top:20px;
    background:white;
    border-radius:18px;
    padding:25px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);

}

.info h2{

    margin-bottom:15px;

}

.info p{

    line-height:1.8;

}

footer{

    padding:40px;
    text-align:center;
    color:#888;

}

</style>

</head>

<body>

<header>

<h1>🍽 마키노 조식 뷔페 세팅/h1>

<p>직원 매뉴얼</p>

<div class="search">

<input type="text" placeholder="음식 검색">

</div>

</header>

<div class="container">

<div class="card">

<img src="map.png" alt="뷔페 배치도">

</div>

<div class="notice">

👇 배치도의 코너를 터치하세요.

</div>

<div class="info">

<h2>선택한 코너</h2>

<p>

아직 선택된 코너가 없습니다.

<br><br>

배치도의 음식 코너를 터치하면

사진, 기물, 세팅방법이 이곳에 표시됩니다.

</p>

</div>

</div>

<footer>

Makino Buffet Guide v1.0

</footer>

</body>

</html>
